<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Optionally set backend origin when front-end is hosted elsewhere:
     <meta name="api-origin" content="https://your-api.example.com">
-->
<title>نظام تسجيل الحضور</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0d2137;
    --blue: #1a3c5e;
    --accent: #2e86de;
    --accent2: #48dbfb;
    --green: #1dd1a1;
    --red: #ff6b6b;
    --yellow: #feca57;
    --bg: #f0f4f8;
    --card: #ffffff;
    --text: #1a2a3a;
    --muted: #6b7a8d;
    --border: #dde3ea;
    --present: #c8f7c5;
    --present-text: #1a7a1a;
    --absent: #ffd6d6;
    --absent-text: #cc0000;
    --late: #fff3cd;
    --late-text: #856404;
    --radius: 12px;
    --shadow: 0 4px 24px rgba(13,33,55,0.10);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; direction: rtl; display: flex; flex-direction: column; position: relative; }

  .watermark-layer { position: fixed; inset: 0; pointer-events: none; z-index: 1; overflow: hidden; }
  .watermark-layer .wm-text {
    position: absolute; top: 42%; left: 50%;
    transform: translate(-50%, -50%) rotate(-26deg);
    font-size: clamp(28px, 7vw, 56px); font-weight: 900; color: var(--navy);
    opacity: 0.04; white-space: nowrap; user-select: none;
    text-shadow: 0 0 1px rgba(255,255,255,0.5);
  }

  .main-wrap { position: relative; z-index: 2; flex: 1; display: flex; flex-direction: column; }

  .site-footer {
    position: relative; z-index: 2;
    margin-top: auto;
    padding: 18px 20px 26px;
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    border-top: 1px solid var(--border);
    background: linear-gradient(180deg, rgba(240,244,248,0.92) 0%, rgba(255,255,255,0.95) 100%);
    line-height: 1.7;
  }
  .site-footer .footer-line { margin: 0; }
  .site-footer .footer-name { font-weight: 700; color: var(--blue); letter-spacing: 0.02em; }
  .site-footer .footer-copy { font-size: 11px; opacity: 0.9; }

  .header { background: linear-gradient(135deg, var(--navy) 0%, var(--blue) 100%); color: white; padding: 0 32px; height: 70px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 16px rgba(0,0,0,0.2); position: sticky; top: 0; z-index: 100; }
  .header-brand { display: flex; align-items: center; gap: 12px; }
  .header-icon { font-size: 28px; }
  .header-title { font-size: 20px; font-weight: 700; }
  .header-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .header-date { font-size: 13px; color: var(--accent2); font-weight: 600; background: rgba(255,255,255,0.1); padding: 6px 14px; border-radius: 20px; }
  .header-api-status { font-size: 11px; font-weight: 700; padding: 5px 12px; border-radius: 20px; letter-spacing: 0.02em; }
  .header-api-status.ok { background: rgba(29,209,161,0.22); color: #7bedc9; border: 1px solid rgba(29,209,161,0.35); }
  .header-api-status.err { background: rgba(255,107,107,0.2); color: #ffc9c9; border: 1px solid rgba(255,107,107,0.35); }
  .header-api-status[hidden] { display: none !important; }

  .container { max-width: 1200px; margin: 0 auto; padding: 28px 24px; }
  .section-label { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 14px; }

  .groups-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; margin-bottom: 32px; }
  .group-card { background: var(--card); border: 2px solid var(--border); border-radius: var(--radius); padding: 18px 20px; cursor: pointer; transition: all 0.2s ease; box-shadow: var(--shadow); position: relative; overflow: hidden; }
  .group-card::before { content: ''; position: absolute; top: 0; right: 0; width: 4px; height: 100%; background: var(--accent); transform: scaleY(0); transition: transform 0.2s ease; border-radius: 0 var(--radius) var(--radius) 0; }
  .group-card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 8px 28px rgba(46,134,222,0.15); }
  .group-card:hover::before { transform: scaleY(1); }
  .group-card.active { border-color: var(--accent); background: linear-gradient(135deg, #eef4fd 0%, #dbeafe 100%); }
  .group-card.active::before { transform: scaleY(1); }
  .group-id { font-size: 22px; font-weight: 900; color: var(--accent); line-height: 1; }
  .group-name { font-size: 13px; font-weight: 600; color: var(--text); margin-top: 4px; }
  .group-time { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .group-count { font-size: 11px; font-weight: 600; color: var(--accent); background: rgba(46,134,222,0.1); padding: 3px 10px; border-radius: 20px; display: inline-block; margin-top: 8px; }

  .attendance-panel { display: none; }
  .attendance-panel.visible { display: block; }

  .panel-header { background: var(--card); border-radius: var(--radius); padding: 22px 26px; box-shadow: var(--shadow); margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px; }
  .panel-info h2 { font-size: 22px; font-weight: 800; color: var(--navy); }
  .panel-info p { font-size: 13px; color: var(--muted); margin-top: 3px; }
  .panel-actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

  .date-input { border: 2px solid var(--border); border-radius: 8px; padding: 8px 14px; font-family: 'Cairo', sans-serif; font-size: 14px; color: var(--text); background: var(--bg); cursor: pointer; transition: border-color 0.2s; }
  .date-input:focus { outline: none; border-color: var(--accent); }

  .btn { padding: 10px 20px; border-radius: 8px; font-family: 'Cairo', sans-serif; font-size: 14px; font-weight: 700; cursor: pointer; border: none; transition: all 0.2s ease; display: flex; align-items: center; gap: 7px; white-space: nowrap; }
  .btn:hover { transform: translateY(-1px); }
  .btn-primary { background: var(--accent); color: white; }
  .btn-primary:hover { background: #1a75c8; box-shadow: 0 4px 14px rgba(46,134,222,0.4); }
  .btn-success { background: var(--green); color: white; }
  .btn-success:hover { background: #17b89a; }
  .btn-export { background: linear-gradient(135deg, #1a3c5e, #2e86de); color: white; }
  .btn-export:hover { box-shadow: 0 4px 16px rgba(46,134,222,0.5); }
  .btn-outline { background: white; color: var(--accent); border: 2px solid var(--accent); box-shadow: none; }
  .btn-outline:hover { background: rgba(46,134,222,0.08); box-shadow: 0 4px 12px rgba(46,134,222,0.2); }
  .btn-upload { background: linear-gradient(135deg, #0d9488, #14b8a6); color: white; border: none; }
  .btn-upload:hover { box-shadow: 0 4px 16px rgba(20,184,166,0.45); }
  .btn-sm { padding: 6px 14px; font-size: 12px; }
  .btn-export-range { background: linear-gradient(135deg, #4338ca, #6366f1); color: white; }
  .btn-export-range:hover { box-shadow: 0 4px 16px rgba(99,102,241,0.45); }
  .btn-export-month { background: linear-gradient(135deg, #b45309, #f59e0b); color: white; }
  .btn-export-month:hover { box-shadow: 0 4px 16px rgba(245,158,11,0.45); }
  .btn:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }
  .export-panel { background: var(--card); border-radius: var(--radius); padding: 16px 22px; box-shadow: var(--shadow); margin-bottom: 16px; border: 1px solid var(--border); }
  .export-panel-title { font-size: 14px; font-weight: 800; color: var(--navy); margin-bottom: 12px; }
  .export-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 10px; }
  .export-row:last-child { margin-bottom: 0; }
  .export-hint { font-size: 11px; color: var(--muted); width: 100%; margin-top: 4px; }
  .visually-hidden-file { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

  .quick-actions { background: var(--card); border-radius: var(--radius); padding: 16px 22px; box-shadow: var(--shadow); margin-bottom: 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .quick-label { font-size: 13px; font-weight: 700; color: var(--muted); }
  .btn-all-present { background: var(--present); color: var(--present-text); font-size: 13px; border: none; }
  .btn-all-absent { background: var(--absent); color: var(--absent-text); font-size: 13px; border: none; }
  .btn-clear { background: var(--bg); color: var(--muted); font-size: 13px; border: 1px solid var(--border); }

  .stats-bar { display: flex; gap: 14px; margin-bottom: 16px; flex-wrap: wrap; }
  .stat-pill { background: var(--card); border-radius: 30px; padding: 8px 18px; font-size: 13px; font-weight: 700; box-shadow: var(--shadow); display: flex; align-items: center; gap: 8px; }
  .stat-dot { width: 10px; height: 10px; border-radius: 50%; }
  .dot-present { background: var(--green); }
  .dot-absent { background: var(--red); }
  .dot-late { background: var(--yellow); }
  .dot-unmarked { background: var(--muted); }

  .students-list { display: flex; flex-direction: column; gap: 8px; }
  .student-row { background: var(--card); border-radius: 10px; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border: 2px solid transparent; transition: all 0.2s ease; gap: 12px; }
  .student-row:hover { border-color: var(--border); }
  .student-row.status-present { border-color: #a8f0a4; background: linear-gradient(to left, var(--present), white 60%); }
  .student-row.status-absent { border-color: #ffb8b8; background: linear-gradient(to left, var(--absent), white 60%); }
  .student-row.status-late { border-color: #ffe599; background: linear-gradient(to left, var(--late), white 60%); }
  .student-left { display: flex; align-items: center; gap: 14px; flex: 1; min-width: 0; }
  .student-num { width: 32px; height: 32px; border-radius: 50%; background: var(--bg); color: var(--muted); font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .student-name { font-size: 15px; font-weight: 600; color: var(--text); }
  .status-buttons { display: flex; gap: 6px; flex-shrink: 0; }
  .status-btn { padding: 7px 14px; border-radius: 6px; font-family: 'Cairo', sans-serif; font-size: 12px; font-weight: 700; cursor: pointer; border: 2px solid transparent; transition: all 0.15s ease; background: var(--bg); color: var(--muted); }
  .status-btn:hover { transform: scale(1.05); }
  .status-btn.active-present { background: var(--present); color: var(--present-text); border-color: #4caf50; }
  .status-btn.active-absent { background: var(--absent); color: var(--absent-text); border-color: #f44336; }
  .status-btn.active-late { background: var(--late); color: var(--late-text); border-color: #ff9800; }

  .save-banner { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--navy); color: white; padding: 14px 28px; border-radius: 30px; font-size: 15px; font-weight: 700; box-shadow: 0 8px 32px rgba(0,0,0,0.3); display: flex; align-items: center; gap: 10px; z-index: 999; transition: transform 0.3s ease; }
  .save-banner.show { transform: translateX(-50%) translateY(0); }
  .save-banner.success { background: #1a7a1a; }
  .save-banner.error { background: #cc0000; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
  .empty-state-icon { font-size: 60px; margin-bottom: 16px; }
  .empty-state h3 { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
  .loading { text-align: center; padding: 40px; color: var(--muted); font-size: 16px; }
  .spinner { display: inline-block; width: 30px; height: 30px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 12px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (max-width: 640px) { .container { padding: 16px; } .header { padding: 0 16px; } .panel-header { flex-direction: column; align-items: flex-start; } .student-name { font-size: 13px; } .status-btn { padding: 6px 10px; font-size: 11px; } .groups-grid { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>

<div class="watermark-layer" aria-hidden="true"><span class="wm-text">Omar Ismail Helmy — د. كريم نصر</span></div>

<div class="main-wrap">

<div class="header">
  <div class="header-brand">
    <div class="header-icon">📋</div>
    <div class="header-title">نظام تسجيل الحضور</div>
  </div>
  <div class="header-right">
    <div class="header-date" id="headerDate">-</div>
    <span id="apiStatus" class="header-api-status" hidden title="">—</span>
  </div>
</div>

<div class="container">
  <div class="section-label">اختر المجموعة</div>
  <div class="groups-grid" id="groupsGrid">
    <div class="loading"><div class="spinner"></div><br>جاري التحميل...</div>
  </div>

  <div class="attendance-panel" id="attendancePanel">
    <div class="panel-header">
      <div class="panel-info">
        <h2 id="panelTitle">-</h2>
        <p id="panelSubtitle">-</p>
      </div>
      <div class="panel-actions">
        <input type="date" class="date-input" id="sessionDate">
        <button class="btn btn-primary" onclick="loadAttendanceForDate()">📂 تحميل جلسة</button>
        <button class="btn btn-success" onclick="saveAttendance()">💾 حفظ الحضور</button>
        <button type="button" class="btn btn-outline" onclick="downloadStudentTemplate()" title="تنزيل قالب بتنسيق العربية وحقول جاهزة">📥 تنزيل قالب الطلاب</button>
        <button type="button" class="btn btn-upload" onclick="pickStudentExcel()">📤 رفع قائمة الطلاب (Excel)</button>
        <button type="button" class="btn btn-primary" style="background:#5a6d82" onclick="downloadSampleXlsx()">📄 نموذج Excel</button>
        <button type="button" class="btn btn-export" id="btnExportDay" onclick="exportExcel()">⬇️ تصدير يوم (Excel)</button>
        <input type="file" id="excelStudentsFile" class="visually-hidden-file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" aria-hidden="true" tabindex="-1" onchange="handleStudentExcel(this.files)">
      </div>
    </div>

    <div class="export-panel" id="exportPanel">
      <div class="export-panel-title">📊 تصدير تقارير متقدمة</div>
      <div class="export-row">
        <span class="quick-label" style="margin:0;">من:</span>
        <input type="date" class="date-input" id="exportRangeStart" title="بداية الفترة">
        <span class="quick-label" style="margin:0;">إلى:</span>
        <input type="date" class="date-input" id="exportRangeEnd" title="نهاية الفترة">
        <button type="button" class="btn btn-export-range" id="btnExportRange" onclick="exportAttendanceRange()">⬇️ تصدير فترة</button>
      </div>
      <div class="export-row">
        <span class="quick-label" style="margin:0;">شهر:</span>
        <input type="month" class="date-input" id="exportMonth" title="الشهر المطلوب">
        <button type="button" class="btn btn-export-month" id="btnExportMonth" onclick="exportAttendanceMonth()">⬇️ تصدير الشهر</button>
      </div>
      <p class="export-hint">يتم توليد ملفات Excel بتنسيق RTL مع ملخص الحضور والغياب والتأخر لكل طالب.</p>
    </div>

    <div class="quick-actions">
      <span class="quick-label">تحديد سريع:</span>
      <button class="btn btn-sm btn-all-present" onclick="markAll('حاضر')">✅ الكل حاضر</button>
      <button class="btn btn-sm btn-all-absent" onclick="markAll('غائب')">❌ الكل غائب</button>
      <button class="btn btn-sm btn-clear" onclick="markAll('')">🔄 مسح الكل</button>
    </div>

    <div class="stats-bar" id="statsBar"></div>
    <div class="students-list" id="studentsList"></div>
  </div>
</div>

</div>

<footer class="site-footer">
  <p class="footer-line footer-copy">© تم الإنشاء بواسطة <span class="footer-name">Omar Ismail Helmy</span></p>
  <p class="footer-line footer-copy">تحت إشراف <span class="footer-name">د. كريم نصر</span></p>
</footer>

<div class="save-banner" id="saveBanner">
  <span id="bannerText">-</span>
</div>

<script>
  // API base: local dev uses Flask :5050; hosted on Vercel uses backend on PythonAnywhere.
  function apiOrigin() {
    const meta = document.querySelector('meta[name="api-origin"]');
    if (meta && meta.content && meta.content.trim())
      return meta.content.trim().replace(/\/+$/, '');
    const h = (typeof location !== 'undefined' && location.hostname) || '';
    if (h === 'localhost' || h === '127.0.0.1')
      return 'http://127.0.0.1:5050';
    return 'https://omarismail220.pythonanywhere.com';
  }
  const API = apiOrigin() + '/api';

  let currentGroup = null;
  let currentStudents = [];
  let attendance = {};

  const today = new Date();
  document.getElementById('headerDate').textContent = today.toLocaleDateString('ar-EG', {weekday:'long', year:'numeric', month:'long', day:'numeric'});
  document.getElementById('sessionDate').value = today.toISOString().split('T')[0];
  const em = document.getElementById('exportMonth');
  if (em) em.value = today.toISOString().slice(0, 7);
  const rs = document.getElementById('exportRangeStart');
  const re = document.getElementById('exportRangeEnd');
  if (rs && re) {
    const wk = new Date(today);
    wk.setDate(today.getDate() - 6);
    rs.value = wk.toISOString().split('T')[0];
    re.value = today.toISOString().split('T')[0];
  }

  async function fetchApiInfo() {
    const res = await fetch(API + '/info');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  }

  function setApiStatus(ok, label, titleText) {
    const el = document.getElementById('apiStatus');
    if (!el) return;
    el.hidden = false;
    el.textContent = label;
    el.className = 'header-api-status ' + (ok ? 'ok' : 'err');
    el.title = titleText || '';
  }

  async function bootApp() {
    let infoOk = false;
    try {
      const info = await fetchApiInfo();
      setApiStatus(
        true,
        'API متصل',
        `${info.service} v${info.version} · ${info.groups_count} مجموعات · ${info.server_time || ''}`
      );
      infoOk = true;
    } catch (_) {
      /* /info غير متاح أو خطأ مؤقت — نكمل بـ /groups */
    }
    const groupsOk = await loadGroups();
    if (groupsOk && !infoOk) {
      setApiStatus(true, 'API متصل', 'عبر /groups');
    }
    if (!groupsOk) {
      setApiStatus(false, 'الخادم لا يستجيب', `تأكد أن Flask يعمل على http://127.0.0.1:5050 — شغّل: python app.py`);
    }
  }

  async function loadGroups() {
    try {
      const res = await fetch(API + '/groups');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const groups = await res.json();
      if (!Array.isArray(groups)) throw new Error('bad_json');
      document.getElementById('groupsGrid').innerHTML = groups.map(g => `
        <div class="group-card" id="gc-${g.id}" onclick="selectGroup('${g.id}', this)">
          <div class="group-id">${g.id}</div>
          <div class="group-name">${g.label}</div>
          <div class="group-time">&#x1F550; ${g.time}</div>
          <div class="group-count">${g.count} طالب</div>
        </div>`).join('');
      return true;
    } catch (e) {
      document.getElementById('groupsGrid').innerHTML = `
        <div style="grid-column:1/-1;background:#fff3cd;padding:20px;border-radius:10px;text-align:center;color:#856404;">
          <strong>⚠️ تعذر الاتصال بالخادم المحلي</strong><br>
          <small>
            تأكد أن Flask يعمل. افتح Terminal وشغّل:<br>
            <code style="background:#f8f4e0;padding:4px 10px;border-radius:4px;display:inline-block;margin:8px 0;">python app.py</code><br>
            ثم أعِد تحميل هذه الصفحة.
          </small>
        </div>`;
      return false;
    }
  }

  async function fetchStudentsPayload(groupId) {
    const res = await fetch(API + '/students/' + encodeURIComponent(groupId));
    if (!res.ok) {
      let msg = res.status === 404 ? 'المجموعة غير موجودة' : ('HTTP ' + res.status);
      try {
        const j = await res.json();
        if (j.message) msg = j.message;
      } catch (_) { /* ignore */ }
      throw new Error(msg);
    }
    const data = await res.json();
    if (!Array.isArray(data.students)) throw new Error('استجابة غير متوقعة');
    return data;
  }

  /**
   * Re-fetch roster from API for the selected group — used after Excel import succeeds.
   */
  async function reloadStudentsForCurrentGroup() {
    if (!currentGroup) return false;
    const panel = document.getElementById('attendancePanel');
    document.getElementById('studentsList').innerHTML = '<div class="loading"><div class="spinner"></div><br>جاري التحديث...</div>';
    try {
      const data = await fetchStudentsPayload(currentGroup);
      currentStudents = data.students;
      document.getElementById('panelTitle').textContent = data.label;
      document.getElementById('panelSubtitle').textContent = data.students.length + ' طالب | توقيت: ' + data.time;
      attendance = {}; /* names may have changed; avoid stale keyed map */
      renderStudents();
      updateStats();
      return true;
    } catch (_) {
      document.getElementById('studentsList').innerHTML =
        '<div class="empty-state"><div class="empty-state-icon">⚠️</div><h3>خطأ في تحديث البيانات</h3></div>';
      return false;
    }
  }

  /** Refresh counts on group tiles then restore active card + roster. */
  async function refreshAfterStudentImport() {
    await loadGroups();
    if (!currentGroup) return;
    const card = document.getElementById('gc-' + currentGroup);
    if (card) card.classList.add('active');
    await reloadStudentsForCurrentGroup();
  }

  async function selectGroup(groupId, el) {
    document.querySelectorAll('.group-card').forEach(c => c.classList.remove('active'));
    el.classList.add('active');
    currentGroup = groupId;
    attendance = {};
    const panel = document.getElementById('attendancePanel');
    panel.classList.add('visible');
    document.getElementById('studentsList').innerHTML = '<div class="loading"><div class="spinner"></div><br>جاري التحميل...</div>';
    try {
      const data = await fetchStudentsPayload(groupId);
      currentStudents = data.students;
      document.getElementById('panelTitle').textContent = data.label;
      document.getElementById('panelSubtitle').textContent = data.students.length + ' طالب | توقيت: ' + data.time;
      renderStudents();
      updateStats();
      panel.scrollIntoView({behavior:'smooth', block:'start'});
    } catch(e) {
      document.getElementById('studentsList').innerHTML =
        `<div class="empty-state"><div class="empty-state-icon">⚠️</div><h3>${(e.message || '').replace(/</g,'')}</h3></div>`;
    }
  }

  function renderStudents() {
    document.getElementById('studentsList').innerHTML = currentStudents.map((name, i) => {
      const s = attendance[name] || '';
      const rc = s === 'حاضر' ? 'status-present' : s === 'غائب' ? 'status-absent' : s === 'متاخر' ? 'status-late' : '';
      return `<div class="student-row ${rc}" id="row-${i}">
        <div class="student-left"><div class="student-num">${i+1}</div><div class="student-name">${name}</div></div>
        <div class="status-buttons">
          <button class="status-btn ${s==='حاضر'?'active-present':''}" onclick="setStatus(${i},'حاضر')">✅ حاضر</button>
          <button class="status-btn ${s==='غائب'?'active-absent':''}" onclick="setStatus(${i},'غائب')">❌ غائب</button>
          <button class="status-btn ${s==='متاخر'?'active-late':''}" onclick="setStatus(${i},'متاخر')">⏰ متأخر</button>
        </div></div>`;
    }).join('');
  }

  function setStatus(idx, status) {
    const name = currentStudents[idx];
    attendance[name] = attendance[name] === status ? '' : status;
    const row = document.getElementById('row-' + idx);
    const s = attendance[name];
    row.className = 'student-row' + (s==='حاضر'?' status-present':s==='غائب'?' status-absent':s==='متاخر'?' status-late':'');
    const btns = row.querySelectorAll('.status-btn');
    btns[0].className = 'status-btn ' + (s==='حاضر'?'active-present':'');
    btns[1].className = 'status-btn ' + (s==='غائب'?'active-absent':'');
    btns[2].className = 'status-btn ' + (s==='متاخر'?'active-late':'');
    updateStats();
  }

  function markAll(status) {
    currentStudents.forEach(n => { attendance[n] = status; });
    renderStudents(); updateStats();
  }

  function updateStats() {
    const p = currentStudents.filter(n => attendance[n]==='حاضر').length;
    const a = currentStudents.filter(n => attendance[n]==='غائب').length;
    const l = currentStudents.filter(n => attendance[n]==='متاخر').length;
    const u = currentStudents.filter(n => !attendance[n]).length;
    document.getElementById('statsBar').innerHTML = `
      <div class="stat-pill"><div class="stat-dot dot-present"></div> حاضر: <strong>${p}</strong></div>
      <div class="stat-pill"><div class="stat-dot dot-absent"></div> غائب: <strong>${a}</strong></div>
      <div class="stat-pill"><div class="stat-dot dot-late"></div> متأخر: <strong>${l}</strong></div>
      <div class="stat-pill"><div class="stat-dot dot-unmarked"></div> لم يسجل: <strong>${u}</strong></div>`;
  }

  async function saveAttendance() {
    if (!currentGroup) return;
    showBanner('💾 جاري الحفظ...', '');
    try {
      const res = await fetch(API + '/attendance', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({group_id: currentGroup, date: document.getElementById('sessionDate').value, records: attendance})
      });
      showBanner(res.ok ? '✅ تم الحفظ بنجاح!' : '❌ فشل الحفظ', res.ok ? 'success' : 'error');
    } catch(e) { showBanner('❌ خطأ في الاتصال بالخادم', 'error'); }
  }

  async function loadAttendanceForDate() {
    if (!currentGroup) return;
    try {
      const d = document.getElementById('sessionDate').value;
      const q = '?start=' + encodeURIComponent(d) + '&end=' + encodeURIComponent(d);
      const res = await fetch(API + '/attendance/' + encodeURIComponent(currentGroup) + q);
      const all = await res.json();
      if (all[d]) {
        attendance = all[d];
        renderStudents();
        updateStats();
        showBanner('📂 تم تحميل الجلسة', 'success');
      } else {
        showBanner('⚠️ لا توجد بيانات لهذا التاريخ', '');
      }
    } catch (e) {
      showBanner('❌ خطأ في الاتصال', 'error');
    }
  }

  function downloadSampleXlsx() {
    showBanner('⬇️ جاري تنزيل النموذج...', '');
    const a = document.createElement('a');
    a.href = API + '/sample-attendance-xlsx';
    a.target = '_blank';
    a.rel = 'noopener';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => showBanner('✅ تم فتح التنزيل', 'success'), 600);
  }

  async function downloadExportBlob(relPath, errCtx) {
    const ids = ['btnExportDay', 'btnExportRange', 'btnExportMonth'];
    ids.forEach(id => { const el = document.getElementById(id); if (el) el.disabled = true; });
    try {
      showBanner('⬇️ جاري تجهيز الملف...', '');
      const res = await fetch(API + relPath);
      if (!res.ok) {
        let msg = errCtx || 'فشل التصدير';
        try {
          const j = await res.json();
          if (j.message) msg = j.message;
        } catch (_) { /* not JSON */ }
        showBanner('❌ ' + msg, 'error');
        return;
      }
      const cd = res.headers.get('Content-Disposition');
      let fname = 'export.xlsx';
      if (cd && cd.includes('filename=')) {
        const m = /filename\*?=(?:UTF-8''|)([^;]+)/i.exec(cd);
        if (m && m[1]) fname = decodeURIComponent(m[1].trim().replace(/['"]/g, ''));
      }
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = fname;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showBanner('✅ تم التنزيل', 'success');
    } catch (_) {
      showBanner('❌ تعذّر التحميل', 'error');
    } finally {
      ids.forEach(id => { const el = document.getElementById(id); if (el) el.disabled = false; });
    }
  }

  async function exportExcel() {
    if (!currentGroup) return;
    const d = document.getElementById('sessionDate').value;
    await downloadExportBlob(
      '/export/' + encodeURIComponent(currentGroup) + '?date=' + encodeURIComponent(d),
      'تصدير اليوم'
    );
  }

  async function exportAttendanceRange() {
    if (!currentGroup) return;
    const s = document.getElementById('exportRangeStart').value;
    const e = document.getElementById('exportRangeEnd').value;
    if (!s || !e) {
      showBanner('⚠️ اختر تاريخ البداية والنهاية', '');
      return;
    }
    await downloadExportBlob(
      '/export-range/' + encodeURIComponent(currentGroup) +
        '?start=' + encodeURIComponent(s) + '&end=' + encodeURIComponent(e),
      'تصدير الفترة'
    );
  }

  async function exportAttendanceMonth() {
    if (!currentGroup) return;
    const ym = document.getElementById('exportMonth').value;
    if (!ym || ym.length < 7) {
      showBanner('⚠️ اختر الشهر', '');
      return;
    }
    const parts = ym.split('-');
    const y = parts[0];
    const m = parts[1];
    await downloadExportBlob(
      '/export-month/' + encodeURIComponent(currentGroup) +
        '?year=' + encodeURIComponent(y) + '&month=' + encodeURIComponent(m),
      'تصدير الشهر'
    );
  }

  /** GET /api/template/<group_id> — RTL workbook with roster prefilled */
  function downloadStudentTemplate() {
    if (!currentGroup) return;
    showBanner('⬇️ جاري تنزيل القالب...', '');
    const a = document.createElement('a');
    a.href = API + '/template/' + encodeURIComponent(currentGroup);
    a.rel = 'noopener';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => showBanner('✅ تم تنزيل قالب الطلاب', 'success'), 600);
  }

  function pickStudentExcel() {
    if (!currentGroup) {
      showBanner('⚠️ اختر مجموعة أولاً', '');
      return;
    }
    const inp = document.getElementById('excelStudentsFile');
    if (!inp) return;
    inp.value = '';
    inp.click();
  }

  /** POST multipart to /api/import-students/<group_id> — JSON success/errors + UI refresh */
  async function handleStudentExcel(fileList) {
    const f = fileList && fileList[0];
    if (!f || !currentGroup) return;
    const nameLc = (f.name || '').toLowerCase();
    if (!nameLc.endsWith('.xlsx')) {
      showBanner('❌ يُقبل امتداد .xlsx فقط', 'error');
      return;
    }
    showBanner('📤 جاري رفع القائمة والتحقق منها...', '');
    try {
      const fd = new FormData();
      fd.append('file', f, f.name);
      const res = await fetch(API + '/import-students/' + encodeURIComponent(currentGroup), {
        method: 'POST',
        body: fd
      });
      const j = await res.json().catch(() => ({}));
      if (!res.ok) {
        const msg = j.message || j.error || ('HTTP ' + res.status);
        showBanner('❌ ' + msg, 'error');
        return;
      }
      if (j.success) {
        const n = typeof j.imported_count === 'number' ? j.imported_count : '';
        showBanner('✅ تم تحديث أسماء الطلاب بنجاح' + (n !== '' ? ' (' + n + ' اسم)' : '') + '!', 'success');
        await refreshAfterStudentImport();
      } else {
        showBanner('❌ ' + (j.message || 'فشل الاستيراد'), 'error');
      }
    } catch (_) {
      showBanner('❌ تعذّر الاتصال بالخادم أثناء الرفع', 'error');
    }
  }

  function showBanner(text, type) {
    const b = document.getElementById('saveBanner');
    b.className = 'save-banner ' + type;
    document.getElementById('bannerText').textContent = text;
    b.classList.add('show');
    clearTimeout(b._t);
    b._t = setTimeout(() => b.classList.remove('show'), 3000);
  }

  bootApp();
</script>
